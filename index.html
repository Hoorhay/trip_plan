<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Plan">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trip Plan</title>
<style>
/* Layout: one narrow column built for a thumb. Day strip on top, one day card below, a banner for what is next. */
:root{
  --bg:#0f1110; --surface:#181b19; --ink:#f4f4f1; --muted:#9ea39c; --line:#2a2e2b;
  --accent:#6fb03c; --accent-ink:#0d1a07; --warn:#e8b93a; --warn-bg:#2b2410;
  --err:#ff8a7d; --err-bg:#2f1815; --crit:#ff6b5e; --crit-bg:#2a1513; --we:#e0b030; --today:#f4f4f1;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;margin:0;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{margin:2px 0 0;font-size:24px;line-height:1.1;font-weight:600;text-wrap:balance}
.route{font-size:13px;color:var(--muted);margin-top:2px}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px}
.tab{flex:1;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.banner{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.banner.crit{background:var(--crit-bg);border-color:transparent}
.banner.crit .banner-row + .banner-row{border-top-color:rgba(196,39,28,0.18)}
.banner-row{display:flex;align-items:baseline;gap:8px;width:100%}
.banner-row .k{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);min-width:40px}
.banner-row.crit .k{color:var(--crit)}
.banner-row .t{font-weight:600;min-width:0;overflow-wrap:anywhere;font-size:14px}
.banner-row .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:6px}
.banner-row + .banner-row{padding-top:6px;border-top:1px solid var(--line)}
.strip{position:relative;display:flex;gap:4px;overflow-x:auto;margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px)));padding:2px max(12px,env(safe-area-inset-left,0px)) 4px}
.dchip{flex:0 0 42px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.dchip .wd{font-size:11px;font-weight:500;color:var(--muted)} .dchip .wd.we{color:var(--we)}
.dchip .dom{font-family:var(--mono);font-size:16px;font-weight:600}
.dchip.today{box-shadow:inset 0 0 0 2px var(--today)}
.dchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip.on .wd{color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dayno{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h2{margin:0;font-size:18px;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.date{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:84px minmax(0,1fr);column-gap:8px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.time{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4;overflow-wrap:anywhere}
.time.crit{color:var(--crit)}
.what{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.what.crit .title{font-weight:600;color:var(--crit)}
.what.crit .note{color:var(--crit)}
.note{font-size:13px;color:var(--muted)}
.row.done .title,.row.done .time,.row.done .note{color:var(--muted)}
.what-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.what-chips:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid var(--line);align-items:center}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-size:13px}
a.chip{border-color:var(--accent);font-weight:500}
.nav{display:flex;gap:8px}
.nav button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button:disabled{opacity:.4;cursor:default}
.empty{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.item.today{border-color:var(--accent)}
.item .d{display:flex;flex-direction:column;align-items:center}
.item .sum{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.item .ln.crit{color:var(--crit)}
.item .pl{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:4px}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=time],textarea{width:100%;min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:6px 10px;font-size:14px}
textarea{font-family:var(--mono);font-size:12px;min-height:90px;white-space:pre}
.btn{min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.msg{padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.issue{padding:8px 10px;border-radius:8px;font-size:13px;background:var(--warn-bg)}
.issue.error{background:var(--err-bg)}
.issue b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px;color:var(--warn)}
.issue.error b{color:var(--err)}
.issue code{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:2px}
.hint{font-size:12px;color:var(--muted)}
.rules{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.rules code{font-family:var(--mono);font-size:12px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="eyebrow" id="range"></div>
    <h1 id="title">Trip</h1>
    <div class="route" id="route"></div>
    <div class="hint" id="stamp" style="margin-top:4px"></div>
  </header>
  <div id="banner"></div>
  <nav class="tabs" aria-label="Views">
    <button type="button" class="tab" data-tab="day">Day</button>
    <button type="button" class="tab" data-tab="all">All days</button>
    <button type="button" class="tab" data-tab="data">Data</button>
  </nav>
  <main id="view"></main>
</div>

<script>
/*PURE-START*/
var WD = ['ne','po','ut','st','št','pi','so'];

function pad(n){ return String(n).padStart(2, '0'); }
function trim(s){ return s.trim(); }
function arrows(s){ return s.replace(/>/g, '➔'); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(); }

function parseCSV(t){
  t = t.replace(/^﻿/, '');
  var first = t.split('\n')[0] || '';
  var D = (first.split('\t').length > first.split(',').length) ? '\t' : ',';
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < t.length; i++) {
    var c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === D) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function parseActivity(raw, report){
  var line = raw.trim();
  if (!line) return null;
  if (line.indexOf(';') === -1) {
    report('warning', 'No ";" in this line. Shown as written.');
    return { plain: true, text: arrows(line) };
  }
  var f = line.split(';').map(trim);
  var item = { plain: false, crit: false, timeText: '', time: null, title: '', notes: [], maps: [] };
  var t = f[0];
  if (t[0] === '!') { item.crit = true; t = t.slice(1).trim(); }
  item.timeText = t;
  if (t !== '') {
    var m = t.match(/^(\d{1,2}):(\d{2})(?:\s*-\s*(\d{1,2}):(\d{2}))?$/);
    if (m && Number(m[1]) < 24 && Number(m[2]) < 60 && (m[3] === undefined || (Number(m[3]) < 24 && Number(m[4]) < 60))) {
      item.time = { start: Number(m[1]) * 60 + Number(m[2]), end: m[3] === undefined ? null : Number(m[3]) * 60 + Number(m[4]) };
    } else report('warning', 'Could not read "' + t + '" as a time. It is shown as written and left out of the next-up banner.');
  }
  f.slice(1).forEach(function(x, i){
    if (!x) return;
    if (x[0] === '@') {
      var q = x.slice(1).trim();
      if (q) item.maps.push(q); else report('warning', '"@" needs a place after it.');
    } else if (i === 0) item.title = arrows(x);
    else item.notes.push(arrows(x));
  });
  return item;
}

function buildTrip(text){
  var rows = parseCSV(text), issues = [];
  var title = ((rows[0] && rows[0][0]) || '').trim() || 'Trip';
  var hi = -1;
  for (var i = 0; i < rows.length; i++) if ((rows[i][0] || '').trim() === '#') { hi = i; break; }
  var col = { day: 1, date: 2, place: 3, act: 4, pool: 6 };
  if (hi >= 0) rows[hi].forEach(function(h, k){
    var n = norm(h);
    if (n === 'den' || n === 'day') col.day = k;
    if (n === 'datum' || n === 'date') col.date = k;
    if (n === 'miesto' || n === 'place') col.place = k;
    if (n === 'aktivity' || n === 'activities') col.act = k;
    if (n === 'pool') col.pool = k;
  });
  var days = [];
  rows.slice(hi + 1).forEach(function(r){
    if (!/^\d+$/.test((r[0] || '').trim())) return;
    var dateText = (r[col.date] || '').trim();
    var day = { n: r[0].trim(), iso: '', dateText: dateText, dom: '', wd: (r[col.day] || '').trim(), weekend: false, place: arrows((r[col.place] || '').trim()), items: [], pool: [] };
    function add(level, msg, raw){ issues.push({ level: level, msg: msg, day: day.n, raw: raw || '' }); }
    var dm = dateText.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})$/), im = dateText.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    var y, mo, d;
    if (dm) { d = +dm[1]; mo = +dm[2]; y = +dm[3]; } else if (im) { y = +im[1]; mo = +im[2]; d = +im[3]; }
    if (y) {
      day.iso = y + '-' + pad(mo) + '-' + pad(d);
      var dt = new Date(Date.UTC(y, mo - 1, d)), g = dt.getUTCDay();
      day.weekend = g === 0 || g === 6; day.dom = String(d);
      if (!day.wd) day.wd = WD[g];
    } else add('error', 'Date not understood. Use 25.9.2027 or 2027-09-25.', dateText);
    String(r[col.act] || '').split(/\r?\n/).forEach(function(raw){
      var it = parseActivity(raw, function(l, m){ add(l, m, raw.trim()); });
      if (it) day.items.push(it);
    });
    String(r[col.pool] || '').split(/\r?\n/).forEach(function(raw){
      var f = raw.split(';').map(trim).filter(Boolean);
      if (!f.length) return;
      var name = '', q = '';
      f.forEach(function(x, i){
        if (x[0] === '@') { var p = x.slice(1).trim(); if (i === 0) name = p; q = p; }
        else name = name ? name + ' ; ' + x : x;
      });
      if (name) day.pool.push({ name: arrows(name), map: q });
    });
    days.push(day);
  });
  return { title: title, days: days, issues: issues };
}
/*PURE-END*/

(function(){
  var KEY = { csv: 'pocket.csv', at: 'pocket.at', src: 'pocket.src' };
  function sget(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  function $(id){ return document.getElementById(id); }
  function h(tag, attrs){
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
    return el;
  }
  var state = { trip: { title: '', days: [], issues: [] }, tab: 'day', sel: 0, clock: null, info: { src: '', at: '' }, msg: '', persist: 'unknown', csv: '' };

  function now(){
    var d = new Date();
    var iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var min = d.getHours() * 60 + d.getMinutes();
    if (state.clock) {
      if (state.clock.date) iso = state.clock.date;
      if (state.clock.time) { var p = state.clock.time.split(':'); min = Number(p[0]) * 60 + Number(p[1]); }
    }
    return { iso: iso, min: min };
  }
  function diffDays(a, b){
    var pa = a.split('-'), pb = b.split('-');
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  }
  function mapUrl(q){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q); }
  function lineText(it){
    if (it.plain) return it.text;
    var dest = it.maps.length ? arrows(it.maps.join(' · ')) : '';
    return (it.timeText ? it.timeText + '  ' : '') + (it.title || dest || it.notes[0] || '');
  }

  function initSel(){
    var n = now().iso, days = state.trip.days, k = -1;
    if (!days.length) return;
    for (var i = 0; i < days.length; i++) if (days[i].iso && days[i].iso >= n) { k = i; break; }
    state.sel = k === -1 ? days.length - 1 : k;
  }

  function load(text, src, persist){
    var trip = buildTrip(text);
    if (!trip.days.length) { state.msg = 'No day rows found. The first column must hold the day numbers (1, 2, 3 …).'; render(); return false; }
    state.trip = trip;
    state.info = { src: src, at: new Date().toLocaleString() };
    state.msg = 'Loaded ' + trip.days.length + ' days from ' + src + '.';
    state.csv = text;
    if (persist) { sset(KEY.csv, text); sset(KEY.src, src); sset(KEY.at, state.info.at); checkPersist(true); }
    initSel(); render();
    return true;
  }

  function renderHead(){
    var t = state.trip, ds = t.days.filter(function(d){ return d.dateText; });
    $('title').textContent = t.title || 'Pocket Trip Plan';
    $('range').textContent = ds.length ? ds[0].dateText + ' – ' + ds[ds.length - 1].dateText : '';
    var testInfo = state.clock ? ' · Clock: ' + (state.clock.date || '') + (state.clock.time ? ' ' + state.clock.time : '') + ' (test)' : '';
    $('stamp').textContent = t.days.length ? 'Plan: ' + state.info.src + (state.info.at ? ' · ' + state.info.at : '') + testInfo : 'No plan loaded';
  }

  function persistText(){
    if (state.persist === 'yes') return 'The browser keeps this data (persistent storage granted).';
    if (state.persist === 'no') return 'The browser may clear this data when the device is low on space. Installing the app to the home screen makes that less likely. Save a copy below to keep a backup.';
    return 'This browser does not report whether saved data is protected.';
  }
  function checkPersist(ask){
    if (!(navigator.storage && navigator.storage.persisted)) return;
    navigator.storage.persisted().then(function(p){
      if (p || !ask || !navigator.storage.persist) return p;
      return navigator.storage.persist();
    }).then(function(g){
      state.persist = g ? 'yes' : 'no';
      var el = $('persist'); if (el) el.textContent = persistText();
    }).catch(function(){});
  }
  function saveCopy(){
    var txt = state.csv || sget(KEY.csv);
    if (!txt) { state.msg = 'Nothing to save yet.'; render(); return; }
    var url = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = 'trip-plan.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  function formatDuration(min){
    var h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + ' min';
    return h + ' h' + (m ? ' ' + m + ' min' : '');
  }

  function makeBannerRow(k, t, r, isCrit){
    var row = h('div', { class: 'banner-row' + (isCrit ? ' crit' : '') },
      h('span', { class: 'k', text: k }),
      h('span', { class: 't', text: t }));
    if (r) row.appendChild(h('span', { class: 'r', text: r }));
    return row;
  }

  function renderBanner(){
    var b = $('banner'); b.textContent = ''; b.className = '';
    var t = state.trip, n = now(), idx = -1, ds = t.days;
    for (var i = 0; i < ds.length; i++) if (ds[i].iso === n.iso) idx = i;
    if (idx >= 0) {
      var nowItem = null, next = null;
      ds[idx].items.forEach(function(it){
        if (!it.time) return;
        var end = it.time.end !== null ? it.time.end : it.time.start + 10;
        if (n.min >= it.time.start && n.min < end) {
          if (!nowItem || it.time.start >= nowItem.time.start) nowItem = it;
        }
        if (!next && it.time.start > n.min) {
          next = it;
        }
      });

      var card = h('div', { class: 'banner' });
      if (nowItem) {
        var end = nowItem.time.end !== null ? nowItem.time.end : nowItem.time.start + 10;
        var nowRel = formatDuration(end - n.min) + ' left';
        card.appendChild(makeBannerRow('NOW', lineText(nowItem), nowRel, nowItem.crit));
      }
      if (next) {
        var nextRel = 'in ' + formatDuration(next.time.start - n.min);
        card.appendChild(makeBannerRow('NEXT', lineText(next), nextRel, next.crit));
      } else if (!nowItem) {
        card.appendChild(makeBannerRow('TODAY', 'Nothing timed left', null, false));
      } else {
        card.appendChild(makeBannerRow('NEXT', 'Nothing timed left', null, false));
      }

      if ((nowItem && nowItem.crit) || (next && next.crit)) card.classList.add('crit');
      b.appendChild(card);
    } else {
      var dated = ds.filter(function(d){ return d.iso; });
      if (!dated.length) return;
      var card = h('div', { class: 'banner' });
      if (n.iso < dated[0].iso) {
        var k = diffDays(n.iso, dated[0].iso);
        card.appendChild(makeBannerRow('COUNTDOWN', 'Trip starts in ' + k + (k === 1 ? ' day' : ' days'), null, false));
      } else if (n.iso > dated[dated.length - 1].iso) {
        card.appendChild(makeBannerRow('DONE', 'Trip finished', null, false));
      } else return;
      b.appendChild(card);
    }
  }

  function viewEmpty(){
    var go = h('button', { type: 'button', class: 'btn primary', text: 'Open Data tab' });
    go.addEventListener('click', function(){ state.tab = 'data'; render(); });
    return h('div', { class: 'card' }, h('div', { class: 'empty', text: 'No plan loaded yet.' }), h('div', { class: 'btns' }, go));
  }

  function viewDay(){
    if (!state.trip.days.length) return viewEmpty();
    var t = state.trip, d = t.days[state.sel], n = now();
    var root = h('div', { class: 'list' });
    var strip = h('div', { class: 'strip', role: 'group', 'aria-label': 'Days' });
    t.days.forEach(function(x, i){
      var b = h('button', { type: 'button', class: 'dchip' + (i === state.sel ? ' on' : '') + (x.iso && x.iso === n.iso ? ' today' : ''), 'aria-pressed': i === state.sel ? 'true' : 'false', 'aria-label': 'Day ' + x.n + ', ' + x.wd + ' ' + x.dateText },
        h('span', { class: 'wd' + (x.weekend ? ' we' : ''), text: x.wd }), h('span', { class: 'dom', text: x.dom || x.n }));
      b.addEventListener('click', function(){ state.sel = i; render(); });
      strip.appendChild(b);
    });
    root.appendChild(strip);

    var card = h('section', { class: 'card' },
      h('div', null, h('div', { class: 'dayno', text: 'Day ' + d.n + ' of ' + t.days.length + (d.iso && d.iso === n.iso ? ' · today' : '') }),
        h('h2', { text: d.place || '–' }),
        h('div', { class: 'date', text: (d.wd ? d.wd + ' ' : '') + d.dateText })));
    if (!d.items.length && !d.pool.length) card.appendChild(h('div', { class: 'empty', text: 'Nothing planned' }));
    d.items.forEach(function(it){
      if (it.plain) { card.appendChild(h('div', { class: 'row' }, h('span'), h('div', { class: 'what' }, h('span', { class: 'title', text: it.text })))); return; }
      var done = d.iso === n.iso && it.time && (it.time.end !== null ? it.time.end : it.time.start) < n.min;
      var what = h('div', { class: 'what' + (it.crit ? ' crit' : '') });
      function addChips(){
        var box = h('div', { class: 'what-chips' });
        it.maps.forEach(function(q){ box.appendChild(h('a', { class: 'chip', href: mapUrl(q), target: '_blank', rel: 'noopener', text: arrows(q) })); });
        what.appendChild(box);
      }
      if (it.title) what.appendChild(h('span', { class: 'title', text: it.title }));
      else if (it.maps.length) addChips();
      it.notes.forEach(function(x){ what.appendChild(h('span', { class: 'note', text: x })); });
      if (it.title && it.maps.length) addChips();
      card.appendChild(h('div', { class: 'row' + (done ? ' done' : '') + (it.crit ? ' crit' : '') }, h('div', { class: 'time' + (it.crit ? ' crit' : ''), text: it.timeText }), what));
    });
    if (d.pool.length) {
      var chips = h('div', { class: 'chips' }, h('span', { class: 'dayno', text: 'Pool' }));
      d.pool.forEach(function(p){
        chips.appendChild(p.map ? h('a', { class: 'chip', href: mapUrl(p.map), target: '_blank', rel: 'noopener', text: p.name }) : h('span', { class: 'chip', text: p.name }));
      });
      card.appendChild(chips);
    }
    root.appendChild(card);

    var prev = h('button', { type: 'button', text: '← Previous' }), next = h('button', { type: 'button', class: 'primary', text: 'Next day →' });
    prev.disabled = state.sel === 0; next.disabled = state.sel === t.days.length - 1;
    prev.addEventListener('click', function(){ state.sel--; render(); });
    next.addEventListener('click', function(){ state.sel++; render(); });
    root.appendChild(h('div', { class: 'nav' }, prev, next));
    return root;
  }

  function viewAll(){
    if (!state.trip.days.length) return viewEmpty();
    var n = now(), root = h('div', { class: 'list' });
    state.trip.days.forEach(function(d, i){
      var sum = h('div', { class: 'sum' });
      d.items.forEach(function(it){
        var txt = lineText(it);
        if (txt.trim()) sum.appendChild(h('div', { class: 'ln' + (it.crit ? ' crit' : ''), text: txt }));
      });
      if (d.pool.length) sum.appendChild(h('div', { class: 'ln', text: 'Pool: ' + d.pool.map(function(p){ return p.name; }).join(', ') }));
      if (!sum.childNodes.length) sum.textContent = 'Nothing planned';
      var b = h('button', { type: 'button', class: 'item' + (d.iso && d.iso === n.iso ? ' today' : '') },
        h('div', { class: 'd' }, h('span', { style: 'font-size:11px;color:var(--' + (d.weekend ? 'we' : 'muted') + ')', text: d.wd }),
          h('span', { style: 'font-family:var(--mono);font-size:18px;font-weight:600', text: d.dom || d.n })),
        h('div', null, h('div', { class: 'pl', text: d.place || '–' }), sum));
      b.addEventListener('click', function(){ state.sel = i; state.tab = 'day'; render(); });
      root.appendChild(b);
    });
    return root;
  }

  function viewData(){
    var root = h('div', { class: 'list' });
    root.appendChild(h('div', { class: 'msg', text: state.msg || (state.trip.days.length ? 'Showing ' + state.trip.days.length + ' days from ' + state.info.src + (state.info.at ? ', loaded ' + state.info.at : '') + '.' : 'No plan loaded yet. Load a CSV file or paste text below.') }));

    var file = h('input', { type: 'file', id: 'file', accept: '.csv,.tsv,.txt,text/csv,text/plain' });
    file.addEventListener('change', function(){
      var f = file.files && file.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(){ load(String(r.result), f.name, true); };
      r.readAsText(f);
    });
    var paste = h('textarea', { id: 'paste', placeholder: 'Or paste CSV text here', spellcheck: 'false' });
    var pb = h('button', { type: 'button', class: 'btn primary', text: 'Load pasted text' });
    pb.addEventListener('click', function(){ if (paste.value.trim()) load(paste.value, 'pasted text', true); });
    root.appendChild(h('div', { class: 'card' },
      h('div', { class: 'field' }, h('label', { class: 'lab', for: 'file', text: 'CSV file' }), file),
      h('div', { class: 'field' }, h('label', { class: 'lab', for: 'paste', text: 'Pasted text' }), paste, h('div', { class: 'btns' }, pb))));

    var sb = h('button', { type: 'button', class: 'btn', text: 'Save a copy (CSV)' });
    sb.addEventListener('click', saveCopy);
    var rs = h('button', { type: 'button', class: 'btn', text: 'Clear saved plan' });
    rs.addEventListener('click', function(){
      try { localStorage.removeItem(KEY.csv); localStorage.removeItem(KEY.src); localStorage.removeItem(KEY.at); localStorage.removeItem('pocket.url'); } catch (e) {}
      state.trip = { title: '', days: [], issues: [] }; state.info = { src: '', at: '' }; state.csv = ''; state.msg = 'Saved plan cleared.'; render();
    });
    root.appendChild(h('div', { class: 'card' },
      h('div', { class: 'lab', text: 'Saved on this device' }),
      h('div', { class: 'hint', id: 'persist', text: persistText() }),
      h('div', { class: 'btns' }, sb, rs)));

    var rules = h('ul', { class: 'rules' });
    [['time ; text ; note', 'One line per entry. Parts are split at ";".'], ['!10:15', 'A "!" in front of the time makes that line red.'], ['>', 'Shown as ➔.'], ['@Place name', 'A part that starts with @ becomes a link pill to Google Maps.']].forEach(function(r){
      rules.appendChild(h('li', null, h('code', { text: r[0] }), ' ' + r[1]));
    });
    rules.appendChild(h('li', { text: 'Everything else, including any emoji, is shown exactly as written.' }));
    root.appendChild(h('div', { class: 'card' },
      h('div', { class: 'lab', text: 'How lines are read' }), rules));

    var errs = state.trip.issues.filter(function(x){ return x.level === 'error'; }).length, warns = state.trip.issues.length - errs;
    var ic = h('div', { class: 'card' }, h('div', { class: 'lab', text: state.trip.issues.length ? 'Lines to check: ' + errs + ' errors, ' + warns + ' warnings' : 'Lines to check' }));
    if (!state.trip.issues.length) ic.appendChild(h('div', { class: 'empty', text: 'Every line was read cleanly.' }));
    state.trip.issues.forEach(function(x){
      ic.appendChild(h('div', { class: 'issue ' + x.level }, h('b', { text: x.level }), 'Day ' + x.day + ': ' + x.msg, x.raw ? h('code', { text: x.raw }) : null));
    });
    root.appendChild(ic);

    var cd = h('input', { type: 'date', id: 'cdate' }), ct = h('input', { type: 'time', id: 'ctime' });
    var currentDayIso = (state.trip.days[state.sel] && state.trip.days[state.sel].iso) || '';
    cd.value = (state.clock && state.clock.date) ? state.clock.date : currentDayIso;
    if (state.clock && state.clock.time) ct.value = state.clock.time;

    function setClock(){
      state.clock = (cd.value || ct.value) ? { date: cd.value, time: ct.value } : null;
      if (cd.value) initSel();
      renderHead();
      renderBanner();
    }
    cd.addEventListener('change', setClock);
    ct.addEventListener('change', setClock);

    var apply = h('button', { type: 'button', class: 'btn primary', text: 'Open Day view' });
    apply.addEventListener('click', function(){
      setClock();
      state.tab = 'day';
      render();
    });

    var real = h('button', { type: 'button', class: 'btn', text: 'Use real time' });
    real.addEventListener('click', function(){
      state.clock = null;
      cd.value = currentDayIso;
      ct.value = '';
      initSel();
      renderHead();
      renderBanner();
      state.msg = 'Using real time.';
      render();
    });

    root.appendChild(h('div', { class: 'card' },
      h('div', { class: 'lab', text: 'Test the clock' }),
      h('div', { class: 'hint', text: 'Pretend it is a day and time during the trip to see the next-up banner and the greyed-out past items.' }),
      h('div', { class: 'field' }, h('label', { class: 'lab', for: 'cdate', text: 'Date' }), cd),
      h('div', { class: 'field' }, h('label', { class: 'lab', for: 'ctime', text: 'Time' }), ct),
      h('div', { class: 'btns' }, apply, real)));
    return root;
  }

  function render(){
    renderHead(); renderBanner();
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-tab') === state.tab ? 'true' : 'false'); });
    var v = $('view'); v.textContent = '';
    v.appendChild(state.tab === 'all' ? viewAll() : state.tab === 'data' ? viewData() : viewDay());
    state.msg = state.tab === 'data' ? state.msg : '';
    var on = document.querySelector('.dchip.on'), strip = document.querySelector('.strip');
    if (on && strip) strip.scrollLeft = on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2;
  }

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ state.tab = b.getAttribute('data-tab'); if (state.tab !== 'data') state.msg = ''; render(); });
  });

  var saved = sget(KEY.csv);
  if (saved && buildTrip(saved).days.length) {
    state.trip = buildTrip(saved);
    state.info = { src: sget(KEY.src) || 'saved copy', at: sget(KEY.at) || '' };
    state.csv = saved; checkPersist(true);
    initSel(); render();
  } else { state.tab = 'data'; checkPersist(false); render(); }

  document.addEventListener('visibilitychange', function(){ if (!document.hidden) render(); });
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
